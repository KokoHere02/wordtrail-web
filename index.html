<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4EF" />
    <script>
      // Set the saved appearance before the first paint.
      try {
        const savedTheme = localStorage.getItem('wordtrail.theme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
      document.querySelector('meta[name="theme-color"]').setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#141D18' : '#F5F4EF');
    </script>
    <meta
      name="description"
      content="拾词 WORDORY，一点点，记得更久。今天也给英语留一点时间。"
    />
    <title>拾词 WORDORY · 一点点，记得更久</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
